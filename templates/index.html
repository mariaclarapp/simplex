<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solver Simplex</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Programação linear</p>
        <h1>Solver Simplex</h1>
      </header>

      <form id="solver-form" class="workspace">
        <section class="panel">
          <div class="section-heading">
            <span>01</span>
            <h2>Configuração</h2>
          </div>

          <div class="form-grid">
            <label>
              Objetivo
              <div class="custom-select" id="optimization-type" data-value="maximize">
                <button type="button" class="custom-select-trigger" aria-expanded="false">
                  <span>Maximizar</span>
                </button>
                <div class="custom-select-menu" role="listbox">
                  <button type="button" data-value="maximize">Maximizar</button>
                  <button type="button" data-value="minimize">Minimizar</button>
                </div>
              </div>
            </label>

            <label>
              Quantidade de variáveis
              <input id="variable-count" type="number" min="1" value="2">
            </label>
          </div>

          <button type="button" id="build-model" class="secondary-button">Montar modelo</button>
        </section>

        <section class="panel">
          <div class="section-heading">
            <span>02</span>
            <h2>Variáveis</h2>
          </div>
          <div id="variables" class="field-list"></div>
        </section>

        <section class="panel nonneg-panel">
          <details>
            <summary>
              <div class="section-heading">
                <span>03</span>
                <h2>Não negatividade</h2>
              </div>
              <span class="details-hint">Alterar</span>
            </summary>
            <p class="helper-text">Por padrão, cada variável é considerada maior ou igual a zero. Desmarque apenas quando a variável puder assumir valores negativos.</p>
            <div id="non-negativity" class="option-grid"></div>
          </details>
        </section>

        <section class="panel">
          <div class="section-heading">
            <span>04</span>
            <h2>Função objetivo</h2>
          </div>
          <div id="objective" class="coefficient-grid"></div>
        </section>

        <section class="panel">
          <div class="section-heading">
            <span>05</span>
            <h2>Restrições</h2>
          </div>
          <div id="constraints" class="constraint-list"></div>
          <button type="button" id="add-constraint" class="secondary-button">Adicionar restrição</button>
        </section>

        <button type="submit" class="primary-button">Resolver modelo</button>
      </form>

      <section id="results" class="panel results-panel" hidden>
        <div class="section-heading">
          <span>06</span>
          <h2>Resultado</h2>
        </div>
        <div id="solution"></div>
        <div id="report"></div>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
