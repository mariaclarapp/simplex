<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solver Simplex</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <main>
      <h1>Solver Simplex</h1>

      <form id="formulario">
        <section>
          <h2>Configuração</h2>
          <div class="grade">
            <label>
              Objetivo
              <select id="tipo-otimizacao">
                <option value="maximizar">Maximizar</option>
                <option value="minimizar">Minimizar</option>
              </select>
            </label>

            <label>
              Quantidade de variáveis
              <input id="quantidade-variaveis" type="number" min="1" value="2">
            </label>
          </div>
          <button type="button" id="montar-modelo">Montar modelo</button>
        </section>

        <section>
          <h2>Variáveis</h2>
          <div id="variaveis" class="grade"></div>
        </section>

        <section>
          <details>
            <summary>Não negatividade</summary>
            <p>Por padrão, cada variável é considerada maior ou igual a zero.</p>
            <div id="nao-negatividade" class="grade"></div>
          </details>
        </section>

        <section>
          <h2>Função objetivo</h2>
          <div id="objetivo" class="grade"></div>
        </section>

        <section>
          <h2>Restrições</h2>
          <div id="restricoes"></div>
          <button type="button" id="adicionar-restricao">Adicionar restrição</button>
        </section>

        <button type="submit" class="principal">Resolver modelo</button>
      </form>

      <section id="resultado" hidden>
        <h2>Relatórios</h2>
        <div id="relatorio"></div>
      </section>
    </main>

    <script src="/static/script.js"></script>
  </body>
</html>
